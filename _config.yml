# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------
theme: minimal-mistakes-jekyll
minimal_mistakes_skin: air # gray background; colors tuned in assets/css/main.scss

locale: en-US
title: Taehyeong Kim
name: Taehyeong Kim
description: >-
  Undergraduate researcher at UNIST working on reservoir-computing digital twins
  and critical transitions in nonlinear dynamical systems.
url: https://taehyeong1001.github.io
baseurl: ""
repository: taehyeong1001/taehyeong1001.github.io
search: true
breadcrumbs: false
words_per_minute: 200

# -----------------------------------------------------------------------------
# Author sidebar
# -----------------------------------------------------------------------------
author:
  name: Taehyeong Kim
  avatar: /assets/img/prof_pic.jpg
  bio: >-
    Undergraduate researcher, Nonlinear Complex System Lab, UNIST.
  location: Ulsan, South Korea
  links:
    - label: UNIST Mathematical Sciences
      icon: fas fa-fw fa-university
      url: https://math.unist.ac.kr/
    - label: GitHub
      icon: fab fa-fw fa-github
      url: https://github.com/taehyeong1001
    # - label: Email
    #   icon: fas fa-fw fa-envelope-square
    #   url: mailto:TODO@unist.ac.kr

footer:
  links:
    - label: GitHub
      icon: fab fa-fw fa-github
      url: https://github.com/taehyeong1001

# -----------------------------------------------------------------------------
# Content
# -----------------------------------------------------------------------------
include: ["_pages"]
exclude:
  - vendor
  - Gemfile
  - Gemfile.lock
  - README.md
  - bin/
  - profile.JPG
  - .claude/

collections:
  projects:
    output: true
    permalink: /research/:name/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: projects
    values:
      layout: single
      author_profile: true
      share: false
      classes: wide

markdown: kramdown
kramdown:
  math_engine: mathjax
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
